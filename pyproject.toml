[project]
name = "rag-against-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.10",
    "fire>=0.7.1",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
]
